<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f7fa">
  <title>卡培他滨片用药指导</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #173047;
      background: #f3f7fa;
    }

    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 16px max(24px, env(safe-area-inset-bottom)); }
    main {
      width: min(100%, 540px);
      margin: 16px auto;
      padding: 28px 24px;
      background: #fff;
      border: 1px solid #e0e9ef;
      border-radius: 22px;
      box-shadow: 0 8px 30px rgb(32 51 79 / 6%);
    }
    .eyebrow { color: #52718e; font-size: 15px; font-weight: 700; letter-spacing: .06em; }
    h1 { margin: 12px 0; font-size: clamp(27px, 7vw, 34px); line-height: 1.35; }
    .intro { color: #526b80; font-size: 18px; line-height: 1.7; }
    .controls { display: grid; gap: 12px; margin: 24px 0 14px; }
    button {
      min-height: 58px;
      padding: 12px 16px;
      border: 0;
      border-radius: 14px;
      font: inherit;
      font-size: 19px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }
    button:focus-visible { outline: 3px solid #f0b429; outline-offset: 3px; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    .play { color: #fff; background: #176d91; }
    .secondary { color: #254d66; background: #edf3f7; }
    #status { min-height: 1.7em; margin: 10px 0 22px; color: #385a70; font-size: 16px; line-height: 1.7; }
    h2 { margin: 26px 0 12px; font-size: 21px; }
    .bodycopy { margin: 0; padding: 17px; border-radius: 14px; background: #f5f8fa; font-size: 19px; line-height: 2; }
    .notice { margin: 22px 0 0; padding: 14px 16px; border-left: 4px solid #78a88b; background: #f2f8f4; color: #365a45; font-size: 16px; line-height: 1.7; }

    @media (max-width: 560px) {
      body { padding-right: 12px; padding-left: 12px; }
      main { padding: 24px 18px; }
      .bodycopy { font-size: 18px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">患者用药教育 · 语音指导</div>
    <h1>卡培他滨片用药指导</h1>
    <p class="intro">点击下方按钮收听用药指导，也可以阅读文字内容。</p>

    <div class="controls" aria-label="语音播放控制">
      <button id="play" class="play" type="button">▶ 点击播放语音</button>
      <button id="pause" class="secondary" type="button" disabled>暂停</button>
      <button id="replay" class="secondary" type="button">重新播放</button>
    </div>
    <p id="status" role="status" aria-live="polite">准备就绪</p>

    <audio id="audio" preload="none">
      <source src="capecitabine.mp3" type="audio/mpeg">
    </audio>

    <section aria-labelledby="text-heading">
      <h2 id="text-heading">用药指导文字</h2>
      <p class="bodycopy">这是卡培他滨片，用于多种实体肿瘤的治疗。请遵医嘱按周期服药，餐后三十分钟内用水整片吞服，早晚间隔约十二小时。漏服无需补服。如出现明显腹泻、手足红肿疼痛或脱皮、口腔溃疡、发热，请及时联系医生或药师。药师咨询请扫描用药指导单上的药师咨询二维码，并按提示操作。</p>
    </section>

    <p class="notice">本内容仅供用药指导，具体用药请遵医嘱。</p>
  </main>

  <script>
    const audio = document.getElementById('audio');
    const playButton = document.getElementById('play');
    const pauseButton = document.getElementById('pause');
    const replayButton = document.getElementById('replay');
    const status = document.getElementById('status');

    function showPlaybackError() {
      const messages = {
        1: '播放已中止。请点击“重新播放”再试一次。',
        2: '暂时无法读取语音文件，请检查网络连接后重试。',
        3: '语音文件无法解码。请稍后重试，或联系页面提供方。',
        4: '当前语音文件格式不受支持。请联系页面提供方。'
      };
      status.textContent = messages[audio.error?.code] || '语音播放失败，请检查网络连接后重试。';
      pauseButton.disabled = true;
    }

    async function startPlayback(fromBeginning = false) {
      if (fromBeginning) audio.currentTime = 0;
      try {
        await audio.play();
      } catch (error) {
        if (error.name === 'NotAllowedError') {
          status.textContent = '浏览器未允许播放，请直接点击“点击播放语音”后重试。';
        } else if (error.name !== 'AbortError') {
          status.textContent = '无法启动语音播放，请检查网络连接后重试。';
        }
        pauseButton.disabled = true;
      }
    }

    playButton.addEventListener('click', () => startPlayback());
    replayButton.addEventListener('click', () => startPlayback(true));
    pauseButton.addEventListener('click', () => {
      audio.pause();
      status.textContent = '已暂停。点击“点击播放语音”可继续播放。';
    });
    audio.addEventListener('playing', () => {
      status.textContent = '正在播放语音';
      pauseButton.disabled = false;
    });
    audio.addEventListener('pause', () => {
      if (audio.currentTime > 0 && !audio.ended && status.textContent === '正在播放语音') {
        status.textContent = '已暂停。点击“点击播放语音”可继续播放。';
      }
      pauseButton.disabled = true;
    });
    audio.addEventListener('ended', () => {
      status.textContent = '播放结束';
      pauseButton.disabled = true;
    });
    audio.addEventListener('error', showPlaybackError);
  </script>
</body>
</html>
